# cargo-audit configuration. CI runs `cargo audit` (see .github/workflows/ci.yml);
# it reads this file automatically. Keep the ignore list in sync with the
# [advisories] section of deny.toml, each entry justified.

[advisories]
ignore = [
    # quick-xml XML-parsing DoS (RUSTSEC-2026-0194 quadratic attribute scan,
    # RUSTSEC-2026-0195 unbounded namespace allocation). Reachable ONLY
    # transitively via plist -> tauri-build / tauri-utils, which parse trusted
    # build-time config and the macOS Info.plist — never agent-supplied or
    # network input at runtime. plist 1.9.0 (latest) hard-pins quick-xml
    # ^0.39.2, so no fixed release exists yet; forcing 0.41 via [patch] breaks
    # plist's build (0.40 renamed the API). Remove once plist ships a version
    # on quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # glib VariantStrIter Iterator/DoubleEndedIterator unsoundness (informational:
    # unsound, non-fatal). Transitive ONLY via tauri 2.11.5 -> gtk 0.18.2 (final
    # GTK3 release), which hard-pins glib ^0.18; the patched glib 0.20 is GTK4-era
    # and rejected by the resolver, so no fix exists until Tauri drops GTK3.
    # Confined to the Linux desktop GUI — glib::VariantStrIter is not used by app
    # code, and the CLI/server/crypto paths pull no GTK. Dependabot alert #2 is
    # left open as a live tracker. Remove once Tauri moves off GTK3.
    "RUSTSEC-2024-0429",
]
