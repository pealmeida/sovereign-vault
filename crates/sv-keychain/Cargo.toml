[package]
name        = "sv-keychain"
version.workspace     = true
edition.workspace     = true
rust-version.workspace= true
license.workspace     = true
repository.workspace  = true
description = "OS keychain abstraction for Sovereign Vault master-key custody."

[features]
# Test-only seam: replaces the native backend with an in-memory store that
# counts every secret read. Never enabled by production builds.
test-fake = ["dep:tokio"]

[dependencies]
thiserror = { workspace = true }
zeroize   = { workspace = true }
tokio    = { workspace = true, optional = true }
keyring   = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }

[lints]
workspace = true
