name: Production release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing production tag to build (select the same tag in "Use workflow from")
        required: true
        type: string

# Jobs opt in to broader permissions only when they create attestations or the
# draft release. Signing credentials are scoped to the production-release
# environment and are unavailable to the validation and test jobs.
permissions:
  contents: read

concurrency:
  group: production-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  NODE_VERSION: '20.20.2'
  RELEASE_RUST_TOOLCHAIN: '1.88.0'
  TAURI_CLI_VERSION: '2.11.4'
  SYFT_VERSION: 'v1.48.0'

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate tag, commit, and version consistency
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
            if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "Manual runs must select the same existing tag in the workflow ref selector." >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Production tags must use canonical vMAJOR.MINOR.PATCH syntax." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "The checked-out commit does not match ${tag}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "The release tag must point to a commit reachable from origin/main." >&2
            exit 1
          fi

          version="$(node <<'NODE'
          const fs = require('node:fs');

          const tauri = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
          const ui = JSON.parse(fs.readFileSync('ui/package.json', 'utf8'));
          const uiLock = JSON.parse(fs.readFileSync('ui/package-lock.json', 'utf8'));
          const cargo = fs.readFileSync('Cargo.toml', 'utf8');
          const workspacePackage = cargo.split('[workspace.package]')[1]?.split(/^\[/m)[0];
          const workspaceMatch = workspacePackage?.match(/^version\s*=\s*"([^"]+)"/m);
          if (!workspaceMatch) throw new Error('Cannot read workspace.package.version');

          const versions = new Map([
            ['Tauri config', tauri.version],
            ['workspace Cargo.toml', workspaceMatch[1]],
            ['UI package.json', ui.version],
            ['UI package-lock.json', uiLock.packages?.['']?.version],
          ]);
          for (const [source, value] of versions) {
            if (value !== tauri.version) {
              throw new Error(`${source} version ${String(value)} does not match Tauri ${tauri.version}`);
            }
          }
          if (tauri.version === '0.0.0') {
            throw new Error('0.0.0 is a development sentinel and cannot be released');
          }
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tauri.version)) {
            throw new Error(`Tauri version ${tauri.version} is not canonical MAJOR.MINOR.PATCH`);
          }
          process.stdout.write(tauri.version);
          NODE
          )"

          if [[ "$tag" != "v${version}" ]]; then
            echo "Tag ${tag} does not match configured version ${version}." >&2
            exit 1
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$head_commit" >> "$GITHUB_OUTPUT"

  rust-gates:
    name: Rust gates (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI for desktop embedding
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

      - name: Build release workspace
        if: runner.os == 'Linux'
        run: cargo build --workspace --release

  gateway-gate:
    name: Gateway validation (live MCP)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Run live gateway validation
        run: cargo run -p sv-validate --release

  msrv-gate:
    name: MSRV 1.88
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88'
      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Check workspace at MSRV
        run: cargo check --workspace

  security-gate:
    name: Supply-chain policy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Install cargo-audit 0.22.2
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Enforce dependency bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans sources

  ui-gate:
    name: UI typecheck and build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Audit UI dependencies
        working-directory: ui
        run: npm audit --audit-level=moderate
      - name: Typecheck UI
        working-directory: ui
        run: npm run check
      - name: Build UI
        working-directory: ui
        run: npm run build

  build-signed:
    name: Signed bundle (${{ matrix.id }})
    needs: [validate, rust-gates, gateway-gate, msrv-gate, security-gate, ui-gate]
    runs-on: ${{ matrix.os }}
    environment:
      name: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-22.04
            bundles: --bundles appimage,deb
            rust-targets: ''
          - id: macos-universal
            os: macos-latest
            bundles: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - id: windows-x86_64
            os: windows-latest
            bundles: --bundles nsis,msi --config release.windows.json
            rust-targets: ''
    steps:
      - name: Validate release approval and external-audit records
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          APPROVED_RELEASE_TAG: ${{ vars.APPROVED_RELEASE_TAG }}
          RELEASE_APPROVAL_RECORD: ${{ vars.RELEASE_APPROVAL_RECORD }}
          EXTERNAL_AUDIT_APPROVED_TAG: ${{ vars.EXTERNAL_AUDIT_APPROVED_TAG }}
          EXTERNAL_AUDIT_REPORT_SHA256: ${{ vars.EXTERNAL_AUDIT_REPORT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_RELEASE_TAG" == "$RELEASE_TAG" ]] || {
            echo "APPROVED_RELEASE_TAG must equal ${RELEASE_TAG}." >&2
            exit 1
          }
          [[ "$EXTERNAL_AUDIT_APPROVED_TAG" == "$RELEASE_TAG" ]] || {
            echo "EXTERNAL_AUDIT_APPROVED_TAG must equal ${RELEASE_TAG}." >&2
            exit 1
          }
          [[ -n "$RELEASE_APPROVAL_RECORD" ]] || {
            echo "RELEASE_APPROVAL_RECORD is required." >&2
            exit 1
          }
          [[ "$EXTERNAL_AUDIT_REPORT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "EXTERNAL_AUDIT_REPORT_SHA256 must be a SHA-256 digest." >&2
            exit 1
          }

      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Install release Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RELEASE_RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build release UI
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run check
          npm run build

      - name: Install pinned Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Import Linux signing key
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for value in LINUX_GPG_PRIVATE_KEY LINUX_GPG_KEY_ID LINUX_GPG_PASSPHRASE; do
            [[ -n "${!value}" ]] || { echo "Missing ${value}." >&2; exit 1; }
          done
          gnupg_home="$RUNNER_TEMP/sovereign-vault-gnupg"
          mkdir -p "$gnupg_home"
          chmod 700 "$gnupg_home"
          export GNUPGHOME="$gnupg_home"
          printf 'GNUPGHOME=%s\n' "$gnupg_home" >> "$GITHUB_ENV"
          printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$LINUX_GPG_KEY_ID" >/dev/null

      - name: Import Apple signing identity and notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for value in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [[ -n "${!value}" ]] || { echo "Missing ${value}." >&2; exit 1; }
          done

          keychain_password="$(openssl rand -base64 32)"
          keychain_path="$RUNNER_TEMP/sovereign-vault.keychain-db"
          certificate_path="$RUNNER_TEMP/sovereign-vault.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "$APPLE_SIGNING_IDENTITY" >/dev/null
          rm -f "$certificate_path"

          printf 'APPLE_KEYCHAIN_PATH=%s\n' "$keychain_path" >> "$GITHUB_ENV"
          printf 'APPLE_API_KEY_PATH=%s\n' "$api_key_path" >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { throw 'Missing WINDOWS_CERTIFICATE.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'Missing WINDOWS_CERTIFICATE_PASSWORD.' }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'sovereign-vault.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfxPath -Force
          if (-not $certificate.HasPrivateKey) { throw 'Imported Windows certificate has no private key.' }
          if ($certificate.NotAfter -le (Get-Date).ToUniversalTime()) { throw 'Windows signing certificate is expired.' }

          "WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $override = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'https://timestamp.digicert.com'
              }
            }
          }
          $override | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/src-tauri/release.windows.json

      - name: Build signed Linux bundles
        if: runner.os == 'Linux'
        id: tauri-linux
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          SIGN: '1'
          SIGN_KEY: ${{ secrets.LINUX_GPG_KEY_ID }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          APPIMAGETOOL_FORCE_SIGN: '1'
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.bundles }}
          uploadUpdaterJson: false

      - name: Build signed and notarized macOS bundle
        if: runner.os == 'macOS'
        id: tauri-macos
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.bundles }}
          uploadUpdaterJson: false

      - name: Build signed Windows bundles
        if: runner.os == 'Windows'
        id: tauri-windows
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.bundles }}
          uploadUpdaterJson: false

      - name: Stage only expected release bundles
        id: stage
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri-linux.outputs.artifactPaths || steps.tauri-macos.outputs.artifactPaths || steps.tauri-windows.outputs.artifactPaths }}
          RELEASE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const releaseId = process.env.RELEASE_ID;
          const paths = JSON.parse(process.env.ARTIFACT_PATHS || '[]');
          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE);
          const staging = path.resolve('release-staging');
          fs.mkdirSync(staging, { recursive: true });

          const expected = releaseId.startsWith('linux')
            ? ['.AppImage', '.deb']
            : releaseId.startsWith('macos')
              ? ['.dmg']
              : ['.msi', '.exe'];
          const found = new Set();
          let appBundle = '';

          for (const candidate of paths) {
            const requested = path.resolve(candidate);
            const requestedStat = fs.lstatSync(requested);
            if (requestedStat.isSymbolicLink()) throw new Error(`Refusing symlink artifact: ${candidate}`);
            const absolute = fs.realpathSync(requested);
            const relative = path.relative(workspace, absolute);
            if (relative.startsWith(`..${path.sep}`) || path.isAbsolute(relative)) {
              throw new Error(`Artifact is outside the workspace: ${candidate}`);
            }
            const stat = fs.statSync(absolute);
            if (stat.isDirectory()) {
              if (releaseId.startsWith('macos') && absolute.endsWith('.app')) appBundle = absolute;
              continue;
            }
            const suffix = expected.find((extension) => absolute.endsWith(extension));
            if (!suffix) continue;
            const destination = path.join(staging, path.basename(absolute));
            fs.copyFileSync(absolute, destination, fs.constants.COPYFILE_EXCL);
            found.add(suffix);
          }

          for (const extension of expected) {
            if (!found.has(extension)) throw new Error(`Missing expected ${extension} bundle`);
          }
          if (releaseId.startsWith('macos') && !appBundle) {
            throw new Error('Missing signed macOS .app bundle for verification');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `app_bundle_path=${appBundle}\n`);
          NODE

      - name: Add and verify detached Linux signatures
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(release-staging/*.AppImage release-staging/*.deb)
          [[ ${#artifacts[@]} -gt 0 ]] || { echo 'No Linux artifacts to sign.' >&2; exit 1; }
          for artifact in "${artifacts[@]}"; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" \
              --local-user "$LINUX_GPG_KEY_ID" \
              --armor --detach-sign "$artifact"
            gpg --batch --verify "${artifact}.asc" "$artifact"
          done
          appimages=(release-staging/*.AppImage)
          chmod +x "${appimages[@]}"
          for appimage in "${appimages[@]}"; do
            [[ -n "$("$appimage" --appimage-signature)" ]] || {
              echo "Missing embedded AppImage signature: ${appimage}" >&2
              exit 1
            }
          done

      - name: Verify macOS signature, notarization, and staple
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_BUNDLE_PATH: ${{ steps.stage.outputs.app_bundle_path }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE_PATH"
          codesign -d --verbose=4 "$APP_BUNDLE_PATH" 2>&1 \
            | grep -F -- "Authority=${APPLE_SIGNING_IDENTITY}" >/dev/null
          spctl --assess --type execute --verbose=4 "$APP_BUNDLE_PATH"
          xcrun stapler validate "$APP_BUNDLE_PATH"
          for dmg in release-staging/*.dmg; do
            hdiutil verify "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Verify Windows Authenticode signatures and timestamps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = Get-ChildItem release-staging -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($artifacts.Count -lt 2) { throw 'Expected both NSIS and MSI artifacts.' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($artifact.Name) ($($signature.Status))" }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERT_THUMBPRINT) {
              throw "Unexpected Authenticode signer: $($artifact.Name)"
            }
            if ($null -eq $signature.TimeStamperCertificate) { throw "Missing Authenticode timestamp: $($artifact.Name)" }
          }

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-staging
          format: spdx-json
          output-file: release-staging/sbom-${{ matrix.id }}.spdx.json
          artifact-name: sbom-${{ matrix.id }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false

      - name: Compute attestation subjects
        shell: bash
        env:
          RELEASE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const files = fs.readdirSync('release-staging')
            .map((name) => path.join('release-staging', name))
            .filter((name) => fs.statSync(name).isFile())
            .sort();
          if (files.length === 0) throw new Error('No staged release artifacts');
          const checksum = (file) => {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            return `${digest} *${path.basename(file)}`;
          };
          const sbomFiles = files.filter((file) => path.basename(file).startsWith('sbom-'));
          const artifactLines = files.filter((file) => !sbomFiles.includes(file)).map(checksum);
          const provenanceLines = files.map(checksum);
          if (artifactLines.length === 0 || sbomFiles.length !== 1) {
            throw new Error('Attestation subjects must include artifacts and exactly one generated SBOM');
          }
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, `subjects-${process.env.RELEASE_ID}.sha256`),
            `${artifactLines.join('\n')}\n`,
          );
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, `provenance-subjects-${process.env.RELEASE_ID}.sha256`),
            `${provenanceLines.join('\n')}\n`,
          );
          NODE

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/provenance-subjects-${{ matrix.id }}.sha256

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/subjects-${{ matrix.id }}.sha256
          sbom-path: release-staging/sbom-${{ matrix.id }}.spdx.json

      - name: Upload signed bundles and SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.id }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove Apple credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          rm -f "${APPLE_API_KEY_PATH:-}"
          if [[ -n "${APPLE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi

      - name: Remove Windows credentials
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item apps/desktop/src-tauri/release.windows.json -Force -ErrorAction SilentlyContinue

      - name: Remove Linux credentials
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -n "${GNUPGHOME:-}" && "$GNUPGHOME" == "$RUNNER_TEMP/"* ]]; then
            gpgconf --kill all || true
            rm -rf -- "$GNUPGHOME"
          fi

  draft-release:
    name: Assemble draft release
    needs: [validate, build-signed]
    runs-on: ubuntu-latest
    environment:
      name: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Revalidate approval records
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          APPROVED_RELEASE_TAG: ${{ vars.APPROVED_RELEASE_TAG }}
          RELEASE_APPROVAL_RECORD: ${{ vars.RELEASE_APPROVAL_RECORD }}
          EXTERNAL_AUDIT_APPROVED_TAG: ${{ vars.EXTERNAL_AUDIT_APPROVED_TAG }}
          EXTERNAL_AUDIT_REPORT_SHA256: ${{ vars.EXTERNAL_AUDIT_REPORT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_RELEASE_TAG" == "$RELEASE_TAG" ]]
          [[ "$EXTERNAL_AUDIT_APPROVED_TAG" == "$RELEASE_TAG" ]]
          [[ -n "$RELEASE_APPROVAL_RECORD" ]]
          [[ "$EXTERNAL_AUDIT_REPORT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]

      - name: Download signed platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true

      - name: Create release metadata and SHA-256 checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_APPROVAL_RECORD: ${{ vars.RELEASE_APPROVAL_RECORD }}
          EXTERNAL_AUDIT_REPORT_SHA256: ${{ vars.EXTERNAL_AUDIT_REPORT_SHA256 }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const directory = 'release-dist';
          const metadata = {
            tag: process.env.RELEASE_TAG,
            version: process.env.RELEASE_VERSION,
            commit: process.env.RELEASE_COMMIT,
            workflow_run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            release_approval_record: process.env.RELEASE_APPROVAL_RECORD,
            external_audit_report_sha256: process.env.EXTERNAL_AUDIT_REPORT_SHA256.toLowerCase(),
          };
          fs.writeFileSync(path.join(directory, 'RELEASE_METADATA.json'), `${JSON.stringify(metadata, null, 2)}\n`);

          const files = fs.readdirSync(directory)
            .filter((name) => name !== 'SHA256SUMS')
            .map((name) => path.join(directory, name))
            .filter((name) => fs.statSync(name).isFile())
            .sort();
          if (files.length < 10) throw new Error('Release assembly is missing expected platform artifacts or SBOMs');
          const basenames = files.map((name) => path.basename(name));
          if (new Set(basenames).size !== basenames.length) throw new Error('Release asset names are not unique');
          for (const expected of ['.AppImage', '.deb', '.dmg', '.msi', '.exe']) {
            if (!basenames.some((name) => name.endsWith(expected))) throw new Error(`Missing ${expected} release asset`);
          }
          for (const id of ['linux-x86_64', 'macos-universal', 'windows-x86_64']) {
            if (!basenames.includes(`sbom-${id}.spdx.json`)) throw new Error(`Missing SBOM for ${id}`);
          }

          const lines = files.map((file) => {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            return `${digest} *${path.basename(file)}`;
          });
          fs.writeFileSync(path.join(directory, 'SHA256SUMS'), `${lines.join('\n')}\n`);
          NODE

      - name: Attest assembled release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: release-dist/SHA256SUMS

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_APPROVAL_RECORD: ${{ vars.RELEASE_APPROVAL_RECORD }}
          EXTERNAL_AUDIT_REPORT_SHA256: ${{ vars.EXTERNAL_AUDIT_REPORT_SHA256 }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub release already exists for ${RELEASE_TAG}; refusing to overwrite it." >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Signed production candidate for Sovereign Vault ${RELEASE_VERSION} (${RELEASE_COMMIT}).

          This release is intentionally a draft. A release manager who did not perform the build approval must verify the artifacts, audit evidence, and rollback plan before publishing it.

          Release approval record: ${RELEASE_APPROVAL_RECORD}
          External audit evidence SHA-256: ${EXTERNAL_AUDIT_REPORT_SHA256}

          Verify downloaded files with SHA256SUMS and GitHub artifact attestations before installation. See docs/PRODUCTION_RELEASE.md in tag ${RELEASE_TAG} for the complete procedure.
          EOF

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "Sovereign Vault ${RELEASE_VERSION}" \
            --notes-file "$notes" \
            release-dist/*
