name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Surface new RUSTSEC advisories even without a push.
    - cron: '17 6 * * 1'

# Least privilege by default.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      # `cargo test --all-features` enables the desktop crate's
      # custom-protocol feature, whose generate_context! embeds ui/dist at
      # compile time — so the UI must be built before any all-features step.
      - name: Install Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Build UI (required by --all-features desktop embed)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo build (release, workspace compiles)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --workspace --release

  gateway-validation:
    # End-to-end production-readiness check: drives the REAL MCP gateway
    # (sv_mcp::McpServer over a loopback WebSocket, backed by a real VaultHandle)
    # as an AI agent through every tool and security scenario. The binary exits
    # non-zero on any behavioural regression (scope bypass, secret leak, missing
    # consent gate, etc.). Has no Tauri/GUI deps, so it runs without apt setup.
    name: Gateway validation (live MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Run live gateway validation
        run: cargo run -p sv-validate --release

  msrv:
    # Real MSRV is 1.88, set by transitive deps (time, darling, serde_with,
    # plist, …). base64ct also needs the edition2024 feature (Rust >= 1.85).
    # Verify with: cargo metadata --format-version 1 | jq '[.packages[].rust_version]'.
    name: MSRV (1.88) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.88'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo check --workspace

  security-audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # cargo-audit CLI fails the build on real vulnerabilities; "unmaintained"
      # advisories (e.g. the GTK3 bindings Tauri pulls in on Linux) are reported
      # but non-fatal — unlike the rustsec/audit-check action, which fails on them.
      - name: Install cargo-audit
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-audit
      - name: cargo audit (fail only on vulnerabilities)
        run: cargo audit
      - name: cargo deny (bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans sources

  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Audit UI dependencies
        working-directory: ui
        run: npm audit --audit-level=moderate

      - name: svelte-check
        working-directory: ui
        run: npm run check

      - name: vite build
        working-directory: ui
        run: npm run build
