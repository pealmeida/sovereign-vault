name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Surface new RUSTSEC advisories even without a push.
    - cron: '17 6 * * 1'

# Least privilege by default.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo build (release, workspace compiles)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --workspace --release

  msrv:
    # Real MSRV is 1.85: a transitive dep (base64ct) requires the edition2024
    # Cargo feature, stabilized in Rust 1.85.
    name: MSRV (1.85) check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  security-audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # cargo-audit CLI fails the build on real vulnerabilities; "unmaintained"
      # advisories (e.g. the GTK3 bindings Tauri pulls in on Linux) are reported
      # but non-fatal — unlike the rustsec/audit-check action, which fails on them.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (fail only on vulnerabilities)
        run: cargo audit
      - name: cargo deny (bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources

  ui:
    name: UI typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: svelte-check
        working-directory: ui
        run: npm run check

      - name: vite build
        working-directory: ui
        run: npm run build
