name: 🐛 Bug report
description: Something isn't working as documented (NOT for security vulnerabilities).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Security vulnerability?** Do not file it here — use
        [Security Advisories](https://github.com/pealmeida/sovereign-vault/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Unlock the vault via …
        2. Run …
        3. See error …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.0.0 or git SHA"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant output. **Redact any secrets.**
      render: shell
