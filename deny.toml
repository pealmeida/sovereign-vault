# cargo-deny configuration — supply-chain policy for the Rust workspace.
# Run locally with: cargo install cargo-deny && cargo deny check
# CI enforces `bans sources` here; vulnerability advisories run via cargo-audit
# (see .github/workflows/ci.yml). The [advisories]/[licenses] config below is
# used only when you run cargo-deny locally with those checks enabled.

[advisories]
# Fail on known-vulnerable / yanked crates. Add IDs here only with a written
# justification if a fix is genuinely unavailable.
ignore = [
  # quick-xml XML-parsing DoS (quadratic attribute scan / unbounded namespace
  # alloc). Reachable ONLY transitively via plist -> tauri-build / tauri-utils,
  # which parse trusted build-time config and macOS Info.plist — never agent-
  # supplied or network input at runtime. plist 1.9.0 (latest) hard-pins
  # quick-xml ^0.39.2, so no fixed release exists yet; a [patch] to 0.41 breaks
  # plist's build (0.40 renamed the API). Remove when plist ships a fix.
  # Tracked for re-review.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # glib VariantStrIter Iterator/DoubleEndedIterator unsoundness (informational:
  # unsound, non-fatal warning). Transitive ONLY via tauri 2.11.5 -> gtk 0.18.2
  # (final GTK3 release), which hard-pins glib ^0.18; the patched glib 0.20 is
  # GTK4-era and rejected by the resolver, so no fix exists until Tauri drops
  # GTK3. Confined to the Linux desktop GUI — glib::VariantStrIter is not used by
  # app code, and the CLI/server/crypto paths pull no GTK. Dependabot alert #2 is
  # left open as a live tracker. Remove when Tauri moves off GTK3.
  "RUSTSEC-2024-0429",
]

[bans]
# Duplicate versions are a warning, not a hard failure (common in large trees).
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io and the official git index are trusted by default.
unknown-registry = "deny"
unknown-git = "deny"

# --- licenses (opt-in) -------------------------------------------------------
# Not enforced in CI yet. To enable, add `licenses` to the cargo-deny command
# and validate this allow-list against `cargo deny check licenses` output.
[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "OpenSSL",
  # webpki-roots (transitive: reqwest -> hyper-rustls). Permissive data-sharing
  # licence for the Mozilla CA root bundle; compatible with Apache-2.0.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
