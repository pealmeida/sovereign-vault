[package]
name        = "sovereign-vault"
version.workspace     = true
edition.workspace     = true
rust-version.workspace= true
license.workspace     = true
repository.workspace  = true
description = "Sovereign Vault headless CLI."

[[bin]]
name = "sovereign-vault"
path = "src/main.rs"

[dependencies]
sv-core           = { workspace = true }
sv-mcp            = { workspace = true }
sv-http           = { workspace = true }
sv-audit          = { workspace = true }
sv-scan           = { workspace = true }
sv-patterns       = { workspace = true }
subtle            = { workspace = true }
tokio             = { version = "1.41", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync", "time", "signal"] }
tokio-tungstenite = { workspace = true }
tokio-util        = { workspace = true }
futures-util      = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
serde_yaml        = "0.9"
clap              = { version = "4.5", features = ["derive", "env"] }
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing           = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror         = { workspace = true }
async-trait       = "0.1"
dirs              = "6.0"

[lints]
workspace = true
