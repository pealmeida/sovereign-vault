[package]
name        = "sovereign-vault-desktop"
version.workspace     = true
edition.workspace     = true
rust-version.workspace= true
license.workspace     = true
repository.workspace  = true
description = "Sovereign Vault desktop application (Tauri 2)."

[lib]
name       = "sovereign_vault_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sv-core               = { workspace = true }
sv-mcp                = { workspace = true }
sv-http               = { workspace = true }
sv-audit              = { workspace = true }
sv-scan               = { workspace = true }
sv-remediate          = { workspace = true, features = ["apply"] }
sv-runtime            = { workspace = true }
chrono                = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
tokio                 = { workspace = true }
tauri                 = { version = "2", features = [] }
tauri-plugin-dialog   = "2"
# notify-rust, pulled in transitively on Linux, requires Rust 1.89 from 4.18.0
# and the workspace MSRV is 1.88, so the lockfile pins it to 4.17.0. Raising the
# MSRV for an OS-notification convenience is the wrong trade; if that pin is
# ever lifted, the MSRV job fails before anything else does.
tauri-plugin-notification = "2"
tauri-plugin-opener   = "2"
tauri-plugin-single-instance = "2"
async-trait           = "0.1"
subtle                = { workspace = true }
tempfile              = { workspace = true }
atomicwrites           = { workspace = true }
sha2                  = { workspace = true }
hex                   = { workspace = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-shell = "2"

# Without `custom-protocol`, a release binary loads `devUrl` (localhost:1420)
# instead of the embedded UI and shows a connection error. `cargo tauri build`
# enables it implicitly. Not a default feature: embedding requires `ui/dist`
# to exist at compile time, which would break `cargo check`/CI on a fresh
# clone before the UI is built. To build a working binary without the Tauri
# CLI: build the UI first, then `cargo build --release --features
# sovereign-vault-desktop/custom-protocol`.
[features]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
