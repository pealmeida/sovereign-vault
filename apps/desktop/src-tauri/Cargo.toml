[package]
name        = "sovereign-vault-desktop"
version.workspace     = true
edition.workspace     = true
rust-version.workspace= true
license.workspace     = true
repository.workspace  = true
description = "Sovereign Vault desktop application (Tauri 2)."

[lib]
name       = "sovereign_vault_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sv-core               = { workspace = true }
sv-mcp                = { workspace = true }
sv-http               = { workspace = true }
sv-audit              = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
tokio                 = { workspace = true }
tauri                 = { version = "2", features = [] }
tauri-plugin-dialog   = "2"
tauri-plugin-fs       = "2"
tauri-plugin-opener   = "2"
tauri-plugin-single-instance = "2"
async-trait           = "0.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-shell = "2"

# Without `custom-protocol`, a release binary loads `devUrl` (localhost:1420)
# instead of the embedded UI and shows a connection error. `cargo tauri build`
# enables it implicitly; defaulting it on makes plain `cargo build --release`
# produce a working binary too. `cargo tauri dev` passes
# `--no-default-features`, so dev mode is unaffected.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
